name: Reference catalog regression
on:
  pull_request:
    paths:
      - 'lib/property-catalog.mjs'
      - 'api/propstack-sold-references.js'
      - 'qa/reference-cache.test.mjs'
      - 'lib/shared-reference-cache.mjs'
      - '.github/workflows/reference-cache-regression.yml'
  workflow_dispatch:
jobs:
  reference-cache:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test qa/reference-cache.test.mjs
